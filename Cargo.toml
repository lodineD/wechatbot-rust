[package]
name = "wechatbot-rust"
version = "0.1.0"
edition = "2024"
authors = ["lodineD"]
description = "A Rust agent that connects WeCom AI bot with DeepSeek."
license = "MIT"
repository = "https://github.com/lodineD/wechatbot-rust"

[dependencies]
wecom-aibot-rust-sdk = "1"
ds-api = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
dashmap = "6"
reqwest = "0.13"
futures = "0.3"
rust-websearch = "0.1"
tokio-tungstenite = "0.21"
chrono = "0.4"
urlencoding = "2"

# Camoufox 浏览器自动化（仅 Unix）
[target.'cfg(unix)'.dependencies]
camoufox = { path = "camoufox-rs" }

[features]
default = []
xhs-camoufox = []  # 启用 camoufox-rs 的小红书搜索

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
wecom-aibot-rust-sdk = { path = "patches/wecom-aibot-rust-sdk" }
ds-api = { path = "patches/ds-api" }
