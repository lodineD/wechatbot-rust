[package]
name = "wechatbot-rust"
version = "0.1.0"
edition = "2024"
authors = ["lodineD"]
description = "A Rust agent that connects WeCom AI bot with DeepSeek."
license = "MIT"
repository = "https://github.com/lodineD/wechatbot-rust"

[dependencies]
wecom-aibot-rust-sdk = "1"
ds-api = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
wecom-aibot-rust-sdk = { path = "patches/wecom-aibot-rust-sdk" }
ds-api = { path = "patches/ds-api" }
