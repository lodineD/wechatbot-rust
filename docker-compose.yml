services:
  wechatbot:
    image: wechatbot-rust-wechatbot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wechatbot-rust
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SPECIAL_USER_ID: "15771075163"
      XHS_ENABLED: "true"
    volumes:
      - ./xhs_cookie.txt:/app/xhs_cookie.txt:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"
